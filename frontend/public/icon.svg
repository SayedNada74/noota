<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="#080C14"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Store/Notebook Graphic in White -->
  <g transform="translate(106, 106)" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Roof / Façade -->
    <path d="M20 120 L280 120 L260 20 L40 20 Z" fill="rgba(255,255,255,0.15)"/>
    <path d="M40 20 L260 20"/>
    <path d="M20 120 L20 260 C20 270 30 280 40 280 L260 280 C270 280 280 270 280 260 L280 120"/>
    <!-- Store Door / Ledger Page -->
    <rect x="100" y="180" width="100" height="100" rx="12" fill="rgba(255,255,255,0.2)"/>
    <line x1="120" y1="210" x2="180" y2="210"/>
    <line x1="120" y1="240" x2="160" y2="240"/>
  </g>
</svg>

